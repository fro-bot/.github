name: Knowledge MCP Summary
description: Add a table of the knowledge MCP server's tool calls to the job summary and print the same text to the step log, from the call log that knowledge-mcp-config names. A log with no matching line and no log at all read differently. It never fails the job.

inputs:
  call-log:
    description: 'The `call-log` output of `knowledge-mcp-config`. Read through `env:` only. A file with no matching line gives `Knowledge tools: server started, no calls.`; an empty input or a missing file gives `Knowledge tools: no call log found (the server did not start, or the run had no log path).`; otherwise a table.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Summarize the knowledge tool calls
      # A caller's `if:` gates the whole action and does not reach this step, which would otherwise carry
      # the implicit success() and be skipped when the agent step before it failed.
      if: ${{ always() }}
      env:
        KNOWLEDGE_MCP_CALL_LOG: ${{ inputs.call-log }}
      run: |
        # A summary is a convenience: nothing below may fail the job, so there is no `set -e`.
        set -uo pipefail

        # The redirect below discards its own error first, so an unset or unwritable summary is silent.
        summary="${GITHUB_STEP_SUMMARY:-}"
        log="${KNOWLEDGE_MCP_CALL_LOG:-}"

        # The server writes `<tool> <code>` and nothing else, so only lines of exactly that shape count.
        # `--` ends option parsing, `-a` reads a binary file as text, and the C locale keeps `[a-z-]`
        # and the sort order the same on every runner. Anything else in the file is never printed.
        #
        # The server creates the file empty once its transport is attached, which is before the client has
        # initialized, so an existing file means it started, not that the agent saw the tools. A missing or
        # unreadable one means it did not start, or no path reached it. The survey's three attempts share one file,
        # so there an existing file means that some attempt's server started, and the table is cumulative.
        counts=''
        found=no
        if [ -n "$log" ] && [ -f "$log" ] && [ -r "$log" ]; then
          found=yes
          counts=$(LC_ALL=C grep -aE '^(wiki_search|wiki_linked|solutions_search) [a-z-]+$' -- "$log" 2>/dev/null |
            LC_ALL=C sort | LC_ALL=C uniq -c 2>/dev/null) || counts=''
        fi

        # The same text goes to the step log, which the run-log CLI and the REST API can read and the job
        # summary cannot. Every line is a fixed string or built from tokens the strict pattern matched, so no
        # line from the file reaches stdout and none can start with `::` to act as a workflow command.
        emit() {
          if [ "$found" = no ]; then
            printf 'Knowledge tools: no call log found (the server did not start, or the run had no log path).\n\n'
          elif [ -z "$counts" ]; then
            printf 'Knowledge tools: server started, no calls.\n\n'
          else
            printf '### Knowledge tool calls\n\n| Tool | Code | Calls |\n| --- | --- | ---: |\n'
            while read -r count tool code; do
              printf '| %s | %s | %s |\n' "$tool" "$code" "$count"
            done <<< "$counts"
            printf '\n'
          fi
        }

        emit 2>/dev/null || true
        emit 2>/dev/null >> "$summary" || true

        exit 0
      shell: bash
