---
name: Setup
description: Setup build environment and install dependencies

runs:
  steps:
    - name: Install mise
      env:
        MISE_VERSION: 2026.11.0 # renovate: datasource=github-releases packageName=jdx/mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: ${{ env.MISE_VERSION }}

    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
        no-cache: true

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash -Eeuo pipefail {0}

  using: composite
