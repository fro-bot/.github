---
name: Gateway Rollout Tracker

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      comment_id:
        description: ID of the operator comment on fro-bot/.github#3512 that requested this run; empty for scheduled and manual runs
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: gateway-rollout-tracker
  cancel-in-progress: false

jobs:
  # ── Preflight: deterministic snapshot + idempotency gate ──────────────────
  # Reads the GitHub Project, tracked issue states, the latest agent and
  # dashboard releases, the latest successful infra deploy runs and the
  # dashboard health contract, builds a stable hash, and compares it to the
  # hash embedded in the latest @fro-bot tracker marker. Outputs
  # should_comment=true when the hash changed or an operator @fro-bot comment
  # has an ID above the marker's last_mention_id. It also outputs those
  # pending comment IDs, the complete marker the agent writes and the ID of
  # the latest marker comment (the in-place edit target). A failed read fails
  # the job.
  preflight:
    name: Rollout Tracker Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_comment: ${{ steps.snapshot.outputs.should_comment }}
      reason: ${{ steps.snapshot.outputs.reason }}
      pending_mention_ids: ${{ steps.snapshot.outputs.pending_mention_ids }}
      marker: ${{ steps.snapshot.outputs.marker }}
      marker_comment_id: ${{ steps.snapshot.outputs.marker_comment_id }}
    steps:
      # The comment ID is templated into the agent prompt, so it is checked before anything else runs.
      - name: Validate comment ID
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
        run: |
          set -euo pipefail
          if [ -n "$COMMENT_ID" ] && ! [[ "$COMMENT_ID" =~ ^[0-9]+$ ]]; then
            printf '::error::comment_id must be numeric\n' >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🔍 Run rollout tracker snapshot preflight
        id: snapshot
        env:
          GH_TOKEN: ${{ secrets.FRO_BOT_PAT }}
        run: |
          set -euo pipefail
          RESULT="$(bun scripts/rollout-tracker-snapshot.ts)"
          SHOULD_COMMENT="$(echo "$RESULT" | jq -r '.should_comment')"
          REASON="$(echo "$RESULT" | jq -r '.reason')"
          PENDING_MENTION_IDS="$(echo "$RESULT" | jq -c '.pending_mention_ids')"
          MARKER="$(echo "$RESULT" | jq -r '.marker')"
          MARKER_COMMENT_ID="$(echo "$RESULT" | jq -r '.marker_comment_id // ""')"
          {
            echo "should_comment=${SHOULD_COMMENT}"
            echo "reason=${REASON}"
            echo "pending_mention_ids=${PENDING_MENTION_IDS}"
            echo "marker_comment_id=${MARKER_COMMENT_ID}"
            echo "marker<<MARKER_TEXT"
            echo "${MARKER}"
            echo "MARKER_TEXT"
          } >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_COMMENT" = "false" ]; then
            echo "::notice::rollout-tracker: no gating transition — ${REASON}"
          else
            echo "::notice::rollout-tracker: wake — ${REASON}"
          fi

  # ── Fro Bot agent: runs after a successful preflight, for an operator mention
  # (comment_id set) or when the preflight reports a wake ───────────────────
  update-rollout-tracker:
    name: Update Rollout Tracker
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      (inputs.comment_id != '' || needs.preflight.outputs.should_comment == 'true')
    uses: ./.github/workflows/fro-bot.yaml
    with:
      prompt: |-
        You own the Gateway operator control-surface rollout tracker:
        the issue fro-bot/.github#3512 (title, body and comments) and the
        GitHub Project at https://github.com/users/fro-bot/projects/1.
        Keep both equal to live state.

        Operator comments to answer. Answer exactly these comments and no
        others, and fetch each one by ID before acting on it
        (gh api repos/fro-bot/.github/issues/comments/<id>):
        - pending mention IDs (JSON array, empty when none):
          ${{ needs.preflight.outputs.pending_mention_ids }}
        - the operator comment ID that requested this run (empty when none):
          ${{ inputs.comment_id }}
        Preflight result: ${{ needs.preflight.outputs.reason }}

        Evidence. Verify every claim against what you can read:
        - state of the linked issues and pull requests;
        - the latest releases of fro-bot/agent and fro-bot/dashboard;
        - the latest successful marcusrbrown/infra runs of Deploy Gateway,
          Deploy Dashboard and the deploy.yaml router;
        - https://dashboard.fro.bot/operator/health (contractVersion);
        - the acceptance-run results the operator posts on
          fro-bot/.github#3512.
        Use the Project items as the tracked rollout source of truth; do not
        rely on a hardcoded issue list. Accept a claim when the evidence
        supports it. Otherwise reject or flag it, state the reason, and leave
        that item unchanged.

        Work, in every run:
        1. Rewrite every stale section of the body of fro-bot/.github#3512:
           current state, open items, the cross-repo dependency matrix and the
           acceptance list.
        2. Update the Project 1 fields (status, readiness, gate) to match, and
           add any missing dependency items.
        3. Maintain the acceptance list. Add each gate raised in a comment or
           an acceptance run. Check off a gate when the evidence supports it.
           Label each entry operator-reported (from the operator's posted
           acceptance runs) or agent-verified (from your own checks). Never
           remove an unmet gate without saying so.
        4. Comment on a tracked issue only when there is issue-specific
           evidence that has not been acknowledged, and link it back to
           fro-bot/.github#3512.

        Replies. When any comment ID is listed above, post one reply on
        fro-bot/.github#3512 that covers all of them: what you verified, what
        you accepted, what you rejected or flagged and why, and what you
        changed in the body and on Project 1. When no comment ID is listed
        and you changed something, post a reply that narrates only that
        change. When no comment ID is listed and nothing needs to change, do
        not post a new comment: edit the marker comment in place with
        gh api -X PATCH repos/fro-bot/.github/issues/comments/<id>, where <id>
        is exactly this marker comment ID (empty when none exists):
        ${{ needs.preflight.outputs.marker_comment_id }}
        Replace only the marker in its body with the marker below. Post a
        one-line seed comment that ends with the marker only when that ID is
        empty.

        All status comments must begin with @fro-bot or explicitly mention
        @fro-bot. Post status updates in a concise, structured format.

        IMPORTANT: End every tracker comment on fro-bot/.github#3512, and
        every in-place edit, with this machine-readable state marker on its
        own line, replacing any prior marker. Copy it exactly, character for
        character; do not reformat, wrap or unescape it:
        ${{ needs.preflight.outputs.marker }}
        Never parse prose tables as state — always read and write the marker.
    secrets:
      FRO_BOT_PAT: ${{ secrets.FRO_BOT_PAT }}
      OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
      OPENCODE_CONFIG: ${{ secrets.OPENCODE_CONFIG }}
      APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
      APPLICATION_PRIVATE_KEY: ${{ secrets.APPLICATION_PRIVATE_KEY }}
