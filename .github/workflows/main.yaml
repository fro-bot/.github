# Continuous Integration jobs for changes headed to main.
---
name: Main

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The one declaration of the Renovate used by `bun run check:renovate-config`. scripts/renovate-runtime.ts
  # reads it from this file, and the inherited bfra-me regex manager for `*_VERSION: x # renovate: ...`
  # in workflow files keeps it current. Renovate is not a repo dependency (its tree carries unfixed
  # advisories that fail `check:override-floors`); it is installed into a scratch prefix at check time.
  RENOVATE_VERSION: 44.172.1 # renovate: datasource=npm depName=renovate

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - env:
          TIMING: 1
        name: 💅🏽 Lint
        run: bun run lint

  check-types:
    name: Check Types
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: ✅ Validate Types
        run: bun run check-types

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🧪 Run Tests
        run: bun run test

  check-wiki-write-core-dist:
    name: Check Wiki Write Core Dist
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: ✅ Verify committed package build
        run: bun run check:wiki-write-core-dist

  test-scripts-load:
    name: Test Scripts Load
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🧪 Load production scripts under Node strip-only
        # Node 24's strip-only TypeScript execution only erases type annotations -- it does
        # not transform TS-specific class constructs (parameter properties, enum, namespace).
        # Neither `tsc --noEmit` nor Vitest exercise the strip-only parser, so those runtime
        # errors used to surface only on scheduled workflow runs. Importing each production
        # script here catches them at merge time instead.
        #
        # The workspace packages (packages/*/src) export .ts source, so their modules load the
        # same way. `find` replaces a `**` glob because default bash has no globstar and node
        # would receive the literal pattern. @fro.bot/wiki-write-core is excluded: it ships
        # compiled dist/, not source. `find` prints nothing when its pattern stops matching, so
        # the loop fails when it finds no module while packages/core/src exists.
        #
        # The path reaches node as an argv element (process.argv[1]) and is never spliced into
        # the JavaScript source, so a file name with a quote in it cannot break or inject code.
        run: |
          load_module() {
            node -e 'const f = process.argv[1]; import(require("node:url").pathToFileURL(f).href).then(() => {}).catch(err => { process.stderr.write("FAIL " + f + ": " + (err.code || err.message) + "\n"); process.exit(1); })' "$1" < /dev/null
          }

          for f in scripts/*.ts; do
            case "$f" in *.test.ts) continue ;; esac
            load_module "$f"
            echo "  ok   $f"
          done

          package_files="$(find packages -path '*/src/*.ts' -not -name '*.test.ts' -not -path 'packages/wiki-write-core/*' | sort)"
          if [ -z "$package_files" ] && [ -d packages/core/src ]; then
            echo 'FAIL: find matched no package module although packages/core/src exists' >&2
            exit 1
          fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            load_module "$f"
            echo "  ok   $f"
          done <<< "$package_files"

  check-workflows:
    name: Check Workflows
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: ✅ Validate Workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: ✅ Validate Renovate Config
        # default.json is a public preset consumed by every repo that extends local>fro-bot/.github.
        # Separate from `bun run lint` because it needs the network: it installs the pinned Renovate
        # (RENOVATE_VERSION above) into a scratch prefix and fetches version-pinned github> presets.
        env:
          RENOVATE_PREFIX: ${{ runner.temp }}/renovate
        run: bun run check:renovate-config

      - name: 🧪 Test Renovate Gate Against Pinned Renovate
        # `bun run test` skips the tests that need a real Renovate install; run them here, against the
        # install the previous step left in RENOVATE_PREFIX.
        env:
          RENOVATE_PREFIX: ${{ runner.temp }}/renovate
        run: bunx --no-install vitest run scripts/check-renovate-config.test.ts scripts/check-renovate-ranges.test.ts scripts/renovate-runtime.test.ts

      - name: 📦 Install Release Tools
        # The semantic-release tool set pinned in release-wiki-write-core.yaml goes into a scratch prefix
        # outside the checkout, with lifecycle scripts off. Nothing is added to package.json or bun.lock.
        env:
          WIKI_WRITE_CORE_RELEASE_PREFIX: ${{ runner.temp }}/wiki-write-core-release
        run: bun scripts/wiki-write-core-release.ts install

      - name: 🧪 Test Release Decision Against Pinned Release Tools
        # `bun run test` skips the tests that need the real plugins; run them here, against the install
        # the previous step left in WIKI_WRITE_CORE_RELEASE_PREFIX. They fail if that prefix is empty.
        env:
          WIKI_WRITE_CORE_RELEASE_PREFIX: ${{ runner.temp }}/wiki-write-core-release
        run: bunx --no-install vitest run scripts/wiki-write-core-release.test.ts

  check-wiki-authority:
    name: Check Wiki Authority
    # Only pull_request events carry a PR author to evaluate against the guard.
    # Post-merge push runs on `main` are already past the gate.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🛡 Enforce Wiki Authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/check-wiki-authority.ts

  check-mutation-guards:
    name: Check Mutation Guards
    # Only pull_request events carry a PR whose changed files can be compared against the
    # trigger set. The wrapper's own changed-file trigger gate short-circuits to
    # `not-applicable` when nothing in the trigger set changed; a post-merge push run on
    # `main` has no PR to diff against, so this job does not run there at all.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🧬 Check Mutation Guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run check:mutation-guards

      - name: ⬆ Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 7
