---
name: Dispatch Renovate

on:
  schedule:
    - cron: '30 */4 * * *' # Every 4 hours at :30 (06:30, 10:30, 14:30, 18:30, 22:30, 02:30 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-renovate
  cancel-in-progress: false

jobs:
  dispatch-renovate:
    name: Dispatch Renovate to tracked repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read-only, owner-wide: GET /installation/repositories lists only repos the token can access.
      - id: discovery-token
        name: Get Discovery Access Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          owner: fro-bot
          permission-metadata: read

      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📦 Setup
        uses: ./.github/actions/setup

      # Intersects metadata/renovate.yaml with the installation's repos; a discovery failure fails the step.
      - id: plan
        name: 🗺 Plan Renovate targets
        env:
          GITHUB_TOKEN: ${{ steps.discovery-token.outputs.token }}
        run: node scripts/dispatch-renovate.ts plan

      # actions: write covers listWorkflowRuns and createWorkflowDispatch on the planned repos only.
      # An empty plan skips this mint, so `repositories:` can never resolve empty (owner-wide).
      - id: dispatch-token
        if: steps.plan.outputs.repositories != ''
        name: Get Dispatch Access Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          owner: fro-bot
          repositories: ${{ steps.plan.outputs.repositories }}
          permission-actions: write

      - id: dispatch
        if: steps.plan.outputs.repositories != ''
        name: 🔄 Dispatch Renovate
        env:
          GITHUB_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          DISPATCH_REPOSITORIES: ${{ steps.plan.outputs.repositories }}
        run: node scripts/dispatch-renovate.ts
