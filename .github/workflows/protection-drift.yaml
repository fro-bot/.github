---
name: Protection Drift

# Reports a change to the `main` branch protection rule that the settings automation did not make, or that
# leaves the rule different from the declared settings (`common-settings.yaml` and `.github/settings.yml`).
# It opens one `protection-drift` issue, comments on it while the drift continues, and closes it when a later
# write by the settings automation (the Fro Bot App bot, matched by type and numeric id) shows every declared
# setting present and matching. It never blocks or reverts the change: the daily `Update Repo Settings` run
# restores the rule. The event runs the workflow definition on the default branch.
#
# There is no concurrency group on purpose: GitHub keeps one running and one pending run per group and replaces
# a pending run when a third arrives, so a burst of events would lose the middle ones. Every event gets its own
# run instead, and the script reconciles two runs that open an issue at the same time (the later issue closes
# as a duplicate of the older one).
on:
  branch_protection_rule:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  report:
    name: Report protection drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `github.token` only: contents to read the declared settings, issues to open, comment on and close the
    # report. No secret, no App token.
    permissions:
      contents: read
      issues: write
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🚨 Report protection drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/protection-drift.ts
