---
name: Update Metadata

on:
  schedule:
    - cron: '30 4 * * *' # Daily at 04:30 UTC (between hourly Poll Invitations and 05:17 Reconcile Repos)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-metadata
  cancel-in-progress: false

jobs:
  update-metadata:
    name: Refresh metadata/renovate.yaml from fro-bot org scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # App-install precondition: APPLICATION_ID / APPLICATION_PRIVATE_KEY must be the
      # fro-bot GitHub App, installed on the github.repository_owner (fro-bot) account with
      # access to the target repos. Four workflows depend on this: update-metadata.yaml,
      # dispatch-renovate.yaml, reconcile-repos.yaml, survey-repo.yaml. The `owner:` input
      # scopes the minted installation token to that owner; without the install (or with a
      # wrong owner) cross-repo reads and dispatches fail with 403/401.
      # Discovery: owner-wide and read-only — installation listing and the renovate workflow probe.
      - id: discovery-token
        name: Get Discovery Access Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-contents: read

      # Writer: this repo only — commitMetadata to the data branch (bypass is actor-based).
      - id: writer-token
        name: Get Writer Access Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📦 Setup
        uses: ./.github/actions/setup

      # Restores only the registry from `data`, the copy that carries an archive before `main` does. Discovery skips
      # every repository whose row there is archived, so a declared archive stops the Renovate list even when GitHub
      # does not report the repository archived. `if-absent: fail`: with no `data` branch the step fails and the
      # list is not refreshed from `main`'s older registry.
      - name: ⤵ Restore the registry from data
        uses: ./.github/actions/sync-data
        with:
          paths: metadata/repos.yaml
          if-absent: fail

      - name: 🔄 Update metadata
        env:
          UPDATE_METADATA_DISCOVERY_TOKEN: ${{ steps.discovery-token.outputs.token }}
          UPDATE_METADATA_WRITER_TOKEN: ${{ steps.writer-token.outputs.token }}
        run: bun scripts/update-metadata.ts
