---
name: Reconcile Repos

on:
  schedule:
    - cron: '17 5 * * *' # Daily at 05:17 UTC (off-peak vs hourly Poll Invitations and Sunday 22:00 Merge Data)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-repos
  cancel-in-progress: false

jobs:
  reconcile-repos:
    name: Reconcile metadata/repos.yaml with GitHub collaborator access
    runs-on: ubuntu-latest
    # Stagger + cap keep fan-out inside this budget even at the maximum configured
    # dispatch count: 12 dispatches × 90s stagger = ~16.5 minutes, plus ≤1 minute of
    # pre-dispatch work (access list, probes, commit). 25 minutes provides headroom
    # for GitHub API jitter without permitting a truly-stuck run.
    timeout-minutes: 25
    steps:
      # Discovery: owner-wide and read-only — installation enumeration and the owned/contrib
      # probes (repo metadata, `.github/workflows/fro-bot.yaml` content) in `scripts/reconcile-repos.ts`.
      - id: discovery-token
        name: Get Discovery Access Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-contents: read

      # Writer: this repo only — data-branch commits (contents), issues and labels (issues),
      # and the survey-repo.yaml dispatch (actions).
      - id: writer-token
        name: Get Writer Access Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-actions: write

      - name: ⤵ Checkout Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📦 Setup
        uses: ./.github/actions/setup

      # Survey writebacks (`recordSurveyResult`) and onboarding writes land on the `data`
      # branch, but the workflow's checkout pulls scripts from the default branch (`main`).
      # Overlay the authoritative `metadata/` tree from `data` so reconcile plans against
      # live state instead of whatever `main` last reflected.
      # git authenticates via the credentials actions/checkout persisted on origin, so no
      # explicit token env is needed here. The fetch is guarded: when `data` does not yet
      # exist (first run, fresh clone, fork, accidental deletion) reconcile bootstraps it,
      # so a missing branch must not hard-fail this step under `set -euo pipefail`.
      # NOTE: `git checkout origin/data -- metadata/` leaves metadata/ staged in the index.
      # Reconcile commits via Octokit (not git CLI), so this is fine. Any future step in this
      # job that depends on a clean index must `git reset HEAD metadata/` first.
      - name: ⤵ Overlay metadata from data branch
        run: |
          set -euo pipefail
          status=0
          git ls-remote --exit-code origin data >/dev/null || status=$?
          case "$status" in
            0)
              git fetch --no-tags origin data
              git checkout origin/data -- metadata/
              ;;
            2)
              echo "data branch not yet established; reconcile will bootstrap it."
              ;;
            *)
              echo "::error::git ls-remote origin data failed with exit code $status; refusing to continue with unverified metadata."
              exit 1
              ;;
          esac

      - name: 🔁 Reconcile repos
        env:
          FRO_BOT_POLL_PAT: ${{ secrets.FRO_BOT_POLL_PAT }}
          RECONCILE_DISCOVERY_TOKEN: ${{ steps.discovery-token.outputs.token }}
          RECONCILE_WRITER_TOKEN: ${{ steps.writer-token.outputs.token }}
          # Stagger between Survey Repo dispatches. Each survey run holds upstream LLM
          # capacity for ~5 minutes; 90 seconds between starts keeps the single seat from
          # saturating under fan-out (see marcusrbrown/infra#144).
          RECONCILE_DISPATCH_STAGGER_MS: '90000'
          # Cap dispatches per reconcile run. Candidates beyond the cap are eligible again
          # on the next run via the staleness gate, producing a progressive day-over-day
          # cadence instead of bursty fan-outs that exhaust upstream capacity.
          RECONCILE_MAX_DISPATCHES_PER_RUN: '12'
        run: node scripts/reconcile-repos.ts | tee "$RUNNER_TEMP/reconcile-result.json"
        shell: bash

      - if: always()
        name: 📋 Write step summary
        run: |
          # Write step summary from reconcile-repos output JSON
          result="$RUNNER_TEMP/reconcile-result.json"
          if [[ ! -s "$result" ]]; then
            echo "reconcile produced no result JSON" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Most fields read from the top level of HandleReconcileResult; the
          # "detected" count lives under .summary.visibilityTransitions (nested).
          {
            echo "## Reconcile Repos Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Dispatched | $(jq '.dispatches // 0' "$result") |"
            echo "| Dispatches deferred | $(jq '.dispatchesDeferred // 0' "$result") |"
            echo "| Dispatches failed | $(jq '.dispatchesFailed // 0' "$result") |"
            echo "| Visibility transition issues | $(jq '.visibilityTransitionIssues // 0' "$result") |"
            echo "| Visibility transitions detected | $(jq '.summary.visibilityTransitions // 0' "$result") |"
            echo "| Visibility transition duplicates skipped | $(jq '.visibilityTransitionDuplicatesSkipped // 0' "$result") |"
            echo "| Per-repo issues | $(jq '.perRepoIssues // 0' "$result") |"
            echo "| Rollup issues | $(jq '.rollupIssues // 0' "$result") |"
            echo "| Issues failed | $(jq '.issuesFailed // 0' "$result") |"
            echo "| Closed stale issues | $(jq '.closedStaleIssues // 0' "$result") |"
            echo "| Probes failed | $(jq '.probesFailed // 0' "$result") |"
            echo "| Committed | $(jq '.committed // false' "$result") |"
            echo "| Entries refreshed | $(jq '.summary.refreshed // 0' "$result") |"
            echo "| Entries migrated | $(jq '.summary.migrated // 0' "$result") |"
            echo "| Entries renamed | $(jq '.summary.renamed // 0' "$result") |"
            echo "| Duplicate entries merged | $(jq '.summary.merged // 0' "$result") |"
            echo "| Renames pending operator action | $(jq '.renamesPending // 0' "$result") |"
            echo "| Rename-pending issues | $(jq '.renamePendingIssues // 0' "$result") |"
            echo "| Rename-pending duplicates skipped | $(jq '.renamePendingDuplicatesSkipped // 0' "$result") |"
            echo "| Closed rename-pending issues | $(jq '.closedRenamePendingIssues // 0' "$result") |"
            echo "| Owner transfers blocked | $(jq '.transferBlocked // 0' "$result") |"
            echo "| Transient identity resolutions | $(jq '.summary.transient // 0' "$result") |"
            echo "| Contrib tracked | $(jq '.summary.byChannel.contrib.tracked // 0' "$result") |"
            echo "| Stuck candidates | $(jq '.summary.stuckCandidates // 0' "$result") |"
            echo "| Stars added | $(jq '.starsAdded // 0' "$result") |"
            echo "| Stars already present | $(jq '.starsAlreadyPresent // 0' "$result") |"
            echo "| Star failures | $(jq '.starFailures // 0' "$result") |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
