---
_extends: .github:common-settings.yaml

repository:
  name: .github
  description: GitHub defaults and community health files for @fro-bot.
  topics: fro-bot, actions, github-actions, renovate-config

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - Analyze (typescript)
          - Check Mutation Guards
          - Check Types
          - Check Wiki Authority
          - Check Wiki Write Core Dist
          - Check Workflows
          - CodeQL
          - Fro Bot
          - Lint
          - Renovate / Renovate
          - Review Dependencies
          - 'Security: Private Leak Scan'
          - Test
          - Test Scripts Load

# Base labels come from common-settings.yaml via _extends, merged by name (requires bfra-me/.github >= v4.32.0; older pins replace the base list and delete it).
labels:
  - name: wiki-lint
    color: '#5319e7'
    description: Applied to every wiki-lint issue
  - name: wiki-lint-finding
    color: '#fbca04'
    description: Deterministic wiki lint finding
  - name: wiki-lint-failure
    color: '#b60205'
    description: Wiki lint execution failure
  - name: reconcile:integrity-alert
    color: '#e11d48'
    description: Integrity alert requiring manual operator review
  - name: reconcile:visibility-transition
    color: '#f97316'
    description: Tracked repo transitioned from public to private
  - name: learning-proposal
    color: '#0e8a16'
    description: Candidate learning proposed from a multi-round-review PR
  - name: cross-repo-goal
    color: '#1d76db'
    description: Coordination issue describing a goal spanning multiple repos
  - name: dispatch-approved
    color: '#0e8a16'
    description: Operator-applied approval that dispatches the proposed items
  - name: pattern-proposal
    color: '#5319e7'
    description: Recurring pattern proposal awaiting operator review
  - name: pattern-proposal:accepted
    color: '#0e8a16'
    description: Pattern proposal accepted as a durable lesson
  - name: pattern-proposal:deferred
    color: '#fbca04'
    description: Pattern proposal deferred pending more evidence
  - name: pattern-proposal:rejected
    color: '#e4e669'
    description: Pattern proposal rejected as low-signal
  - name: pattern-proposal:superseded
    color: '#cfd3d7'
    description: Pattern proposal superseded by a newer proposal
  - name: improvement-metrics-report
    color: '#0e8a16'
    description: Improvement-metric loop report tracking event -> codified-class edges
  - name: needs-review
    color: '#3d5a91'
    description: Data promotion PR needs human review before merge
  - name: reconcile:pending-review
    color: '#2d718c'
    description: Unsolicited collaborator grant awaiting operator review
  - name: reconcile:rollup-pending-review
    color: '#356b73'
    description: Rollup of multiple pending-review grants from one owner
  - name: status-truth
    color: '#5146a5'
    description: Status-truth drift proposal requiring operator review
  - name: status-truth:accepted
    color: '#2e8b8b'
    description: Status-truth proposal accepted as valid drift
  - name: status-truth:rejected
    color: '#8b3a62'
    description: Status-truth proposal rejected (claim was correct)
  - name: status-truth:false-positive
    color: '#702f1e'
    description: Status-truth proposal marked as false positive
  - name: status-truth:superseded
    color: '#c5c9cf'
    description: Status-truth proposal superseded by a newer finding
  - name: status-truth:manually-fixed
    color: '#3f8f72'
    description: Status-truth drift manually corrected
  - name: status-truth:resolved
    color: '#3678a8'
    description: Status-truth drift resolved (auto-closed on clear)
  - name: status-truth:recurring
    color: '#9a7b22'
    description: Status-truth drift recurred after previous resolution
  # Mirrors WORKING_LABEL_COLOR/DESCRIPTION in fro-bot/agent packages/runtime/src/agent/types.ts.
  - name: 'agent: working'
    color: '#fcf2e1'
    description: Agent is currently working on this
