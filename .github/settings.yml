---
_extends: .github:common-settings.yaml

repository:
  name: .github
  description: GitHub defaults and community health files for @fro-bot.
  topics: fro-bot, actions, github-actions, renovate-config

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - Analyze (typescript)
          - Check Mutation Guards
          - Check Types
          - Check Wiki Authority
          - Check Wiki Write Core Dist
          - Check Workflows
          - CodeQL
          - Fro Bot
          - Lint
          - Renovate / Renovate
          - Review Dependencies
          - 'Security: Private Leak Scan'
          - Test
          - Test Scripts Load

# Base set inlined here because _extends replaces (not merges) arrays; see bfra-me/.github#2767
labels:
  - name: automerge
    color: '#8f4fbc'
    description: Automated merge approved
  - name: bug
    color: '#d73a4a'
    description: Something isn't working
  - name: dependencies
    color: '#A0BB41'
    description: Dependency updates or security alerts
  - name: devDependencies
    color: '#f9d0c4'
    description: Development dependency updates
  - name: documentation
    color: '#0075ca'
    description: Improvements or additions to documentation
  - name: duplicate
    color: '#cfd3d7'
    description: This issue or pull request already exists
  - name: enhancement
    color: '#a2eeef'
    description: New feature or request
  - name: good first issue
    color: '#7057ff'
    description: Good for newcomers
