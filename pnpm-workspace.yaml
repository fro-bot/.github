allowBuilds:
  unrs-resolver: true

packages:
  - 'packages/*'

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

overrides:
  ajv@8: 8.20.0
  brace-expansion: '>=5.0.9'
  fast-uri: '>=4.1.3'
  flatted: '>=3.4.2'
  minimatch: '>=10.2.3'
  nanoid: '>=3.3.18 <4'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.18'
  qs: '>=6.15.2'
  # GHSA-68fv-2mgg-jv7q: indexed source maps can block the event loop in ESLint/Vite tooling.
  # Remove when upstream consumers require source-map-js >=1.2.2.
  source-map-js: '>=1.2.2'
  undici: '>=8.9.0'
  vite: '>=8.0.16'
  yaml: '>=2.8.3'

savePrefix: ''

shamefullyHoist: true

shellEmulator: true

minimumReleaseAgeExclude:
  - '@bfra.me/eslint-config@0.54.0'
