allowBuilds:
  unrs-resolver: true

packages:
  - 'packages/*'

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

overrides:
  ajv@8: 8.20.0
  brace-expansion: '>=5.0.9'
  fast-uri: '>=4.1.3'
  flatted: '>=3.4.2'
  minimatch: '>=10.2.3'
  nanoid: '>=3.3.18 <4'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.18'
  qs: '>=6.15.2'
  # GHSA-w293-vg96-wgc3, GHSA-vp8m-p9jh-q5pm, and GHSA-rfgv-xxqx-mfg5 affect <8.10.2.
  # Remove this floor only when all parent ranges exclude the affected versions.
  undici: '>=8.10.2'
  vite: '>=8.0.16'
  yaml: '>=2.8.3'

savePrefix: ''

shamefullyHoist: true

shellEmulator: true

minimumReleaseAgeExclude:
  - '@bfra.me/eslint-config@0.54.0'
