allowBuilds:
  unrs-resolver: true

packages:
  - 'packages/*'

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

overrides:
  ajv@8: 8.20.0
  # GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p: recursion DoS; 5.0.12 also fixes GHSA-q2hr-2g5m-vwhr.
  # Remove this floor only when all parent ranges exclude the affected versions.
  brace-expansion: '>=5.0.12'
  fast-uri: '>=4.1.3'
  flatted: '>=3.4.2'
  minimatch: '>=10.2.3'
  nanoid: '>=3.3.18 <4'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.18'
  qs: '>=6.15.2'
  undici: '>=8.9.0'
  vite: '>=8.0.16'
  yaml: '>=2.8.3'

savePrefix: ''

shamefullyHoist: true

shellEmulator: true

minimumReleaseAgeExclude:
  - '@bfra.me/eslint-config@0.54.0'
